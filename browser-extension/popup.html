<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memos Clipper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Memos Clipper</h1>
        <button id="open-options" type="button" class="icon-button" title="Options">...</button>
      </header>
      <label class="field">
        <span>Visibility</span>
        <select id="visibility">
          <option value="PRIVATE">Private</option>
          <option value="PUBLIC">Public</option>
        </select>
      </label>
      <button id="clip" type="button" class="primary">Clip current page</button>
      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
